<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Appliance - Energy Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ADD YOUR APPLIANCE</h1>
            <p>Share your appliance's energy usage with the community</p>
        </header>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="submit.html" class="active">Add Appliance</a>
        </nav>

        <form id="applianceForm" class="form-container">
            <div class="form-group">
                <label for="type">Appliance Type *</label>
                <select id="type" required>
                    <option value="">Select...</option>
                    <option value="Oven">Oven</option>
                    <option value="Dishwasher">Dishwasher</option>
                    <option value="Washing Machine">Washing Machine</option>
                    <option value="Fridge">Fridge</option>
                    <option value="Freezer">Freezer</option>
                    <option value="Tumble Dryer">Tumble Dryer</option>
                    <option value="TV">TV</option>
                    <option value="Computer">Computer</option>
                    <option value="Microwave">Microwave</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="model">Brand/Model</label>
                <input type="text" id="model" placeholder="e.g., Samsung WW9000">
            </div>

            <div class="form-group">
                <label for="usage">Monthly Energy Usage (kWh) *</label>
                <input type="number" id="usage" step="0.1" required placeholder="e.g., 45.5">
                <small>Check your bill or appliance label</small>
            </div>

            <div class="form-group">
                <label for="age">Age of Appliance</label>
                <select id="age">
                    <option value="">Select...</option>
                    <option value="0-2 years">0-2 years</option>
                    <option value="3-5 years">3-5 years</option>
                    <option value="6-10 years">6-10 years</option>
                    <option value="10+ years">10+ years</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" rows="3" placeholder="Any details about usage patterns..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Data</button>
        </form>

        <div id="successMessage" class="success-message" style="display: none;">
            ✓ Data submitted successfully
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBhZmLP6iim7woNW8ofjNu2d9OQtogACbU",
            authDomain: "appliance-tracker-ac31a.firebaseapp.com",
            projectId: "appliance-tracker-ac31a",
            storageBucket: "appliance-tracker-ac31a.firebasestorage.app",
            messagingSenderId: "94689910263",
            appId: "1:94689910263:web:272206295a7c774d1462f2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('applianceForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newData = {
                type: document.getElementById('type').value,
                model: document.getElementById('model').value || 'Not specified',
                usage: parseFloat(document.getElementById('usage').value),
                age: document.getElementById('age').value || 'Not specified',
                notes: document.getElementById('notes').value,
                date: new Date().toISOString()
            };

            try {
                await db.collection('appliances').add(newData);
                document.getElementById('applianceForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } catch (error) {
                alert('Error saving data: ' + error.message);
                console.error(error);
            }
        });
    </script>
</body>
</html>
