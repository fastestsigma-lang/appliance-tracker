<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Energy Tracker - Appliance Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔌 Home Energy Tracker</h1>
            <p>Compare your appliance energy usage with others</p>
        </header>

        <nav>
            <a href="index.html" class="active">📊 Dashboard</a>
            <a href="submit.html">➕ Add Appliance</a>
        </nav>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Submissions</h3>
                <p id="totalSubmissions">0</p>
            </div>
            <div class="stat-card">
                <h3>Avg Monthly Usage</h3>
                <p id="avgUsage">0 kWh</p>
            </div>
        </div>

        <div class="chart-container">
            <h2>📈 Average Energy Usage by Appliance Type</h2>
            <canvas id="usageChart"></canvas>
        </div>

        <div class="table-container">
            <h2>📋 Recent Submissions</h2>
            <table id="submissionsTable">
                <thead>
                    <tr>
                        <th>Appliance</th>
                        <th>Brand/Model</th>
                        <th>Monthly Usage (kWh)</th>
                        <th>Age</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyBhZmLP6iim7woNW8ofjNu2d9OQtogACbU",
          authDomain: "appliance-tracker-ac31a.firebaseapp.com",
          projectId: "appliance-tracker-ac31a",
          storageBucket: "appliance-tracker-ac31a.firebasestorage.app",
          messagingSenderId: "94689910263",
          appId: "1:94689910263:web:272206295a7c774d1462f2",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let appliances = [];

        // Load data from Firebase
        async function loadData() {
            try {
                const snapshot = await db.collection('appliances').orderBy('date', 'desc').get();
                appliances = [];
                snapshot.forEach(doc => {
                    appliances.push({ id: doc.id, ...doc.data() });
                });
                updateDashboard();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('totalSubmissions').textContent = 'Error loading';
            }
        }

        function updateDashboard() {
            document.getElementById('totalSubmissions').textContent = appliances.length;
            
            if (appliances.length > 0) {
                const totalUsage = appliances.reduce((sum, a) => sum + (a.usage || 0), 0);
                const avg = (totalUsage / appliances.length).toFixed(1);
                document.getElementById('avgUsage').textContent = `${avg} kWh`;
            }

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = appliances.slice(0, 20).map(app => `
                <tr>
                    <td>${app.type || 'Unknown'}</td>
                    <td>${app.model || 'Not specified'}</td>
                    <td>${app.usage || 0} kWh</td>
                    <td>${app.age || 'N/A'}</td>
                    <td>${app.date ? new Date(app.date).toLocaleDateString() : 'N/A'}</td>
                </tr>
            `).join('');

            updateChart();
        }

        function updateChart() {
            const ctx = document.getElementById('usageChart').getContext('2d');
            
            const byType = {};
            appliances.forEach(app => {
                if (!byType[app.type]) {
                    byType[app.type] = { total: 0, count: 0 };
                }
                byType[app.type].total += (app.usage || 0);
                byType[app.type].count++;
            });

            const labels = Object.keys(byType);
            const averages = labels.map(type => 
                (byType[type].total / byType[type].count).toFixed(1)
            );

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Average Monthly Usage (kWh)',
                        data: averages,
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40']
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'kWh per month' }
                        }
                    }
                }
            });
        }

        loadData();
    </script>
</body>
</html>
