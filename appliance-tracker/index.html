<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Energy Tracker - Appliance Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔌 Home Energy Tracker</h1>
            <p>Compare your appliance energy usage with others</p>
        </header>

        <nav>
            <a href="index.html" class="active">📊 Dashboard</a>
            <a href="submit.html">➕ Add Appliance</a>
        </nav>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Submissions</h3>
                <p id="totalSubmissions">0</p>
            </div>
            <div class="stat-card">
                <h3>Avg Monthly Usage</h3>
                <p id="avgUsage">0 kWh</p>
            </div>
        </div>

        <div class="chart-container">
            <h2>📈 Average Energy Usage by Appliance Type</h2>
            <canvas id="usageChart"></canvas>
        </div>

        <div class="table-container">
            <h2>📋 Recent Submissions</h2>
            <table id="submissionsTable">
                <thead>
                    <tr>
                        <th>Appliance</th>
                        <th>Brand/Model</th>
                        <th>Monthly Usage (kWh)</th>
                        <th>Age</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let appliances = [];

        // Load data
        async function loadData() {
            try {
                const response = await fetch('data.json');
                appliances = await response.json();
                updateDashboard();
            } catch (error) {
                console.log('Starting with empty database');
                appliances = [];
                updateDashboard();
            }
        }

        function updateDashboard() {
            // Update stats
            document.getElementById('totalSubmissions').textContent = appliances.length;
            
            if (appliances.length > 0) {
                const totalUsage = appliances.reduce((sum, a) => sum + a.usage, 0);
                const avg = (totalUsage / appliances.length).toFixed(1);
                document.getElementById('avgUsage').textContent = `${avg} kWh`;
            }

            // Update table
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = appliances.slice(-10).reverse().map(app => `
                <tr>
                    <td>${app.type}</td>
                    <td>${app.model}</td>
                    <td>${app.usage} kWh</td>
                    <td>${app.age || 'N/A'}</td>
                    <td>${new Date(app.date).toLocaleDateString()}</td>
                </tr>
            `).join('');

            // Update chart
            updateChart();
        }

        function updateChart() {
            const ctx = document.getElementById('usageChart').getContext('2d');
            
            // Group by type
            const byType = {};
            appliances.forEach(app => {
                if (!byType[app.type]) {
                    byType[app.type] = { total: 0, count: 0 };
                }
                byType[app.type].total += app.usage;
                byType[app.type].count++;
            });

            const labels = Object.keys(byType);
            const averages = labels.map(type => 
                (byType[type].total / byType[type].count).toFixed(1)
            );

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Average Monthly Usage (kWh)',
                        data: averages,
                        backgroundColor: [
                            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', 
                            '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'kWh per month'
                            }
                        }
                    }
                }
            });
        }

        loadData();
    </script>
</body>
</html>
